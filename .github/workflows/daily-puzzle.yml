name: Daily Puzzle

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-puzzle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Daily Riddle
        run: |
          DATA=$(curl -s https://riddles-api.vercel.app/random)

          QUESTION=$(echo "$DATA" | jq -r '.riddle')
          ANSWER=$(echo "$DATA" | jq -r '.answer')

          cat > README.md << EOF
          # Hi 👋

          Welcome to my GitHub profile!

          ## 🧩 Daily Puzzle

          > $QUESTION

          <details>
          <summary>💡 Show Answer</summary>

          $ANSWER

          </details>

          ---
          Automatically updated every day.
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Update daily puzzle" || exit 0
          git push
